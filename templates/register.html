<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Mohit Banking</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">

    <div class="auth-container">

        <!-- LEFT -->

        <div class="auth-info">

            <div class="auth-logo">

                <div class="logo-icon">
                    M
                </div>

                <div>
                    <h2>Mohit</h2>
                    <span>Banking</span>
                </div>

            </div>


            <div class="auth-info-content">

                <span class="auth-label">
                    JOIN THE EXPERIENCE
                </span>

                <h1>
                    Start your
                    <br>
                    journey.
                </h1>

                <p>
                    Create your demo account and explore
                    the Mohit Banking digital experience.
                </p>

            </div>


            <div class="auth-footer">

                <span>Modern Banking</span>

                <span>2026</span>

            </div>

        </div>


        <!-- RIGHT -->

        <div class="auth-form-area">

            <div class="auth-form-box register-box">

                <div class="form-heading">

                    <span>NEW ACCOUNT</span>

                    <h2>Create your account</h2>

                    <p>
                        Fill in the information below.
                    </p>

                </div>


                <form method="POST"
                      action="/register">


                    <div class="two-inputs">

                        <div class="input-group">

                            <label>
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                placeholder="First name"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label>
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                placeholder="Last name"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label>
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            placeholder="Choose a username"
                            required
                        >

                    </div>


                    <div class="two-inputs">

                        <div class="input-group">

                            <label>
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                placeholder="Create password"
                                required
                            >

                        </div>


                        <div class="input-group">

                            <label>
                                Confirm
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                placeholder="Confirm password"
                                required
                            >

                        </div>

                    </div>


                    <label class="terms">

                        <input
                            type="checkbox"
                            required
                        >

                        <span>
                            I agree to the demo account terms
                            and conditions.
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="auth-submit">

                        Create Demo Account →

                    </button>

                </form>


                <div class="register-link">

                    Already have an account?

                    <a href="/login">
                        Login
                    </a>

                </div>


                <a href="/" class="back-home">
                    ← Back to Homepage
                </a>

            </div>

        </div>

    </div>

</body>
</html>
